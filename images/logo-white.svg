<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%" fill="none" role="img" aria-label="The DailyLens Logo White">
  <!-- Newspaper Icon Group -->
  <g id="newspaper-mark-white" transform="translate(10, 10)">
    <!-- Back Page Fold -->
    <path d="M 22 105 L 22 28 C 22 24 25 20 30 20 L 40 20 L 40 105 C 32 105 22 105 22 105 Z" fill="#1E293B" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Main Newspaper Page Front -->
    <rect x="38" y="12" width="80" height="96" rx="4" fill="#0F172A" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Newspaper Diagonal / Column lines -->
    <line x1="48" y1="26" x2="88" y2="26" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    <line x1="48" y1="38" x2="72" y2="38" stroke="#00A896" stroke-width="5" stroke-linecap="round" />
    <line x1="48" y1="50" x2="68" y2="50" stroke="#64748B" stroke-width="4" stroke-linecap="round" />
    <line x1="48" y1="62" x2="62" y2="62" stroke="#64748B" stroke-width="4" stroke-linecap="round" />
    <line x1="48" y1="74" x2="70" y2="74" stroke="#64748B" stroke-width="4" stroke-linecap="round" />
    <line x1="48" y1="86" x2="60" y2="86" stroke="#64748B" stroke-width="4" stroke-linecap="round" />

    <!-- Magnifying Glass -->
    <g transform="translate(42, 6)">
      <!-- Handle -->
      <line x1="72" y1="72" x2="98" y2="98" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" />
      <line x1="75" y1="75" x2="95" y2="95" stroke="#00A896" stroke-width="4" stroke-linecap="round" />
      <!-- Rim -->
      <circle cx="50" cy="50" r="30" fill="#00A896" stroke="#FFFFFF" stroke-width="6" />
      <!-- Inner lens highlight / reflection -->
      <ellipse cx="44" cy="42" rx="18" ry="14" fill="#0284C7" opacity="0.3" />
      <path d="M 34 36 A 20 20 0 0 1 54 28" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
      <circle cx="34" cy="46" r="3" fill="#FFFFFF" opacity="0.9" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(170, 72)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      The Daily<tspan fill="#FFFFFF">L</tspan><tspan fill="#00A896">e</tspan><tspan fill="#FFFFFF">ns</tspan>
    </text>
    <text y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#94A3B8" letter-spacing="4.5">
      YOUR FOCUSED DAILY NEWS
    </text>
  </g>
</svg>
